# Separate container for the navi-connect preview sidecar. Reference only — the
# NAS runs this from GHCR through the Compose Manager plugin, in its own project
# beside `hub` and `lb-bot`; nothing runs the file in this repo.
services:
  navi-connect-preview:
    build: .
    image: navi-connect-preview
    container_name: navi-connect-preview
    restart: unless-stopped
    # Same network as the hub, which reaches /resolve internally. The port is
    # published because CLIENTS fetch /stream directly — the hub never relays
    # audio, and this is the whole reason the sidecar exists as a process.
    networks: [media]
    ports:
      - "4792:4792"
    env_file: .env
    volumes:
      # ONLY the cookie jar. Nothing else is persisted (see the Dockerfile).
      # A directory, not the file: replacing a bind-mounted file changes its
      # inode and the container goes on holding the old one, so refreshing
      # cookies would silently do nothing.
      #
      # Read-WRITE on purpose: yt-dlp refreshes the jar as it goes, and letting
      # it write back is what keeps a session alive past its first rotation.
      - ./cookies:/data

networks:
  media:
    external: true
