# Builds the hub image and publishes it to GHCR.
#
# Lives at the repo root, not in hub/: GitHub only reads workflows from
# .github/workflows/ at the top level of a repository, so the copy that used to
# sit in hub/.github/ (when hub was its own repo) would never fire here.
# `paths:` keeps it from rebuilding on unrelated doc or client changes.
name: hub-docker

on:
  push:
    branches: [main]
    paths:
      - 'hub/**'
      - '.github/workflows/hub-docker.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}-hub

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: ./hub
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
