# Separate container for the navi-connect hub. On Unraid you can also use the
# `docker run` form below (compose `volumes:` are honored here, unlike the bot).
services:
  navi-connect-hub:
    build: .
    image: navi-connect-hub
    container_name: navi-connect-hub
    restart: unless-stopped
    # Same Docker network as Navidrome/AudioMuse/lb-bot so the savePlayQueue mirror
    # and both proxies can reach them internally (none of those needs to be
    # exposed); clients reach the hub — WebSocket, /sonic/* and /lb/* alike — on 4790.
    networks: [media]
    ports:
      - "4790:4790"
    env_file: .env
    volumes:
      - ./data:/data        # persisted session + device registry

networks:
  media:
    external: true
